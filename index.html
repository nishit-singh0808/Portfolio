  <script>
    (function () {
      var title = document.getElementById('portfolio-title');
      var description = document.getElementById('portfolio-description');
      var app = document.getElementById('portfolio-app');
      var header = document.querySelector('.hero-header');
      var greetings = header.querySelectorAll('h2, h1');
      var image = document.querySelector('.profile-image');
      var content = document.querySelector('.portfolio-content');
      var optionGrid = document.querySelector('.option-grid');
      var panel = document.querySelector('.portfolio-panel');
      var avatar = new Image();
      avatar.src = 'images/avatar.svg';
      var sections = {
        Me: 'Nishit',
        Projects: 'Projects',
        Skills: 'Skills',
        Fun: 'Fun',
        Contact: 'Contact'
      };
      var descriptions = {
        Projects: 'Add your projects here.',
        Skills: 'Add your skills here.',
        Fun: 'Add something about yourself here.',
        Contact: 'Add your contact details here.'
      };
      var aboutContent = `
        <div class="about-content">
          <p><strong>Software Engineer • Full-Stack Developer • Test Automation Engineer</strong></p>
          <p>I am a Software Engineer with over 2 years of industry experience across Full-Stack Web Development, iOS Mobile Apps, and Automated Quality Engineering. My work spans building production-grade web applications, integrating LLM models into mobile platforms, and architecting robust test automation suites.</p>
          <p>I specialize in taking products through the entire Software Development Lifecycle (SDLC)—from database design and frontend user interfaces to automated test suites and cloud backends.</p>
          <h3>Experience</h3>
          <ul>
            <li><strong>Software Engineer</strong> | <em>Red Piranha</em><br>Drive automated quality engineering and software reliability using PyTest, Playwright, Selenium, and Robot Framework.</li>
            <li><strong>Full Stack Developer</strong> | <em>Jeffa Industries</em> (1 Year)<br>Developed and shipped production web applications, including client platform <strong>jeffa.in</strong>, utilizing modern web tech stacks and database architectures.</li>
            <li><strong>Software Engineer Intern</strong> | <em>Cetpa Infotech</em> (6 Months)<br>Built core web development foundations, database design principles, and software testing practices.</li>
          </ul>
        </div>`;
      function slideOptions(options, openingButton) {
        var oldRects = options.map(function (option) {
          return option.getBoundingClientRect();
        });
        options.forEach(function (option) {
          option.style.setProperty('transition', 'none', 'important');
        });
        app.classList.add('is-exploring');
        void app.offsetHeight;
        options.forEach(function (option, index) {
          var newRect = option.getBoundingClientRect();
          var deltaX = oldRects[index].left - newRect.left;
          var deltaY = oldRects[index].top - newRect.top;
          option.style.setProperty('--slide-x', deltaX + 'px');
          option.style.setProperty('--slide-y', deltaY + 'px');
          option.style.setProperty('transform', 'translate(var(--slide-x), var(--slide-y))', 'important');
        });
        var startTime = performance.now();
        function animateOptions(now) {
          var finished = true;
          options.forEach(function (option, index) {
            var progress = Math.max(0, Math.min(1, (now - startTime - index * 80) / 1250));
            var eased = 1 - Math.pow(1 - progress, 4);
            var deltaX = parseFloat(option.style.getPropertyValue('--slide-x')) || 0;
            var deltaY = parseFloat(option.style.getPropertyValue('--slide-y')) || 0;
            var scale = option === openingButton && progress >= 1 ? ' scale(1.12) translateX(1rem)' : '';
            option.style.setProperty('transform', 'translate(' + (deltaX * (1 - eased)) + 'px, ' + (deltaY * (1 - eased)) + 'px)' + scale, 'important');
            if (progress < 1) finished = false;
          });
          if (!finished) requestAnimationFrame(animateOptions);
          else options.forEach(function (option) {
            option.style.setProperty('transition', 'none', 'important');
            option.style.setProperty('transform', option === openingButton ? 'scale(1.12) translateX(1rem)' : 'none', 'important');
          });
        }
        requestAnimationFrame(animateOptions);
      }
      document.querySelectorAll('button').forEach(function (button) {
        var label = button.querySelector('span:not(.sr-only)');
        if (!label || !sections[label.textContent]) return;
        button.classList.add('portfolio-option');
        button.addEventListener('click', function () {
          var options = Array.from(document.querySelectorAll('.portfolio-option'));
          var isFirstSelection = !app.classList.contains('is-exploring');
          if (isFirstSelection) {
            image.src = avatar.src;
            slideOptions(options, button);
          }
          else app.classList.add('is-exploring');
          greetings.forEach(function (greeting) {
            greeting.style.setProperty('opacity', '0', 'important');
            greeting.style.setProperty('transform', 'translateY(-2rem) scale(.85)', 'important');
          });
          image.style.setProperty('width', window.innerWidth <= 700 ? '4rem' : '5.5rem', 'important');
          image.style.setProperty('height', window.innerWidth <= 700 ? '4rem' : '5.5rem', 'important');
          content.style.setProperty('width', window.innerWidth <= 700 ? 'calc(100vw - 7rem)' : 'min(42rem, calc(100vw - 10rem))', 'important');
          optionGrid.style.setProperty('width', window.innerWidth <= 700 ? '4rem' : '5.5rem', 'important');
          window.setTimeout(function () {
            greetings.forEach(function (greeting) {
              greeting.style.setProperty('transition', 'none', 'important');
            });
            options.forEach(function (option) {
              option.style.setProperty('transform', option === button ? 'scale(1.12) translateX(1rem)' : 'none', 'important');
            });
            image.style.setProperty('transition', 'none', 'important');
            content.style.setProperty('transition', 'none', 'important');
            optionGrid.style.setProperty('transition', 'none', 'important');
          }, isFirstSelection ? 700 : 50);
          document.querySelectorAll('.portfolio-option').forEach(function (option) {
            option.classList.remove('is-selected');
            option.classList.remove('is-opening');
          });
          button.classList.add('is-selected');
          button.classList.add('is-opening');
          title.textContent = sections[label.textContent];
          description.innerHTML = label.textContent === 'Me' ? aboutContent : descriptions[label.textContent];
          panel.classList.remove('is-switching');
          void panel.offsetWidth;
          panel.classList.add('is-switching');
        });
      });
    }());
  </script>
