      function fallbackCopyText(text) {
        var textArea = document.createElement('textarea');
        textArea.value = text;

        textArea.style.position = 'fixed';
        textArea.style.opacity = '0';

        var copied = document.execCommand('copy');

          });
          if (!finished) requestAnimationFrame(animateOptions);
          else finishSlide();
        }
        requestAnimationFrame(animateOptions);
        if (collapseAfterSlide) window.setTimeout(finishSlide, 1700);
      }
      document.querySelectorAll('button').forEach(function (button) {
        var label = button.querySelector('span:not(.sr-only)');
        if (!label || !sections[label.textContent]) return;
      button.classList.add('portfolio-option');
      button.addEventListener('click', function () {
          var options = Array.from(document.querySelectorAll('.portfolio-option'));
          var isFirstSelection = !app.classList.contains('is-exploring');
          var isAbout = label.textContent === 'Me';
          var isProjects = label.textContent === 'Projects';
          var isSkills = label.textContent === 'Skills';
          var isFun = label.textContent === 'Fun';
          var isMore = label.textContent === 'More';
          if (!isSkills && magnetGrid) returnSkillCardsToGrid(false);
          var imageStartRect = isFirstSelection ? image.getBoundingClientRect() : null;
          if (isFirstSelection) {
            image.style.setProperty('height', imageStartRect.height + 'px', 'important');
            image.src = avatar.src;
            var shouldCollapseMenu = window.innerWidth <= 700;
            if (shouldCollapseMenu) options.forEach(function (option, index) {
              option.style.setProperty('--collapse-y', (-80 - index * 71.2) + 'px');
              option.style.setProperty('--collapse-delay', index * 25 + 'ms');
            });
            slideOptions(options, button, shouldCollapseMenu);
          }
          else app.classList.add('is-exploring');
          if (!isFirstSelection && window.innerWidth <= 700) setMobileMenuExpanded(false);
          greetings.forEach(function (greeting) {
            greeting.style.setProperty('opacity', '0', 'important');
            greeting.style.setProperty('transform', 'translateY(-2rem) scale(.85)', 'important');
          });
          image.style.setProperty('width', window.innerWidth <= 700 ? '4rem' : '5.5rem', 'important');
          image.style.setProperty('height', window.innerWidth <= 700 ? '4rem' : '5.5rem', 'important');
          if (isFirstSelection) {
            var imageTargetRect = image.getBoundingClientRect();
            image.animate([
              { transform: 'translate(' + (imageStartRect.left - imageTargetRect.left) + 'px, ' + (imageStartRect.top - imageTargetRect.top) + 'px)' },
              { transform: 'translate(0, 0)' }
            ], { duration: 1050, easing: 'cubic-bezier(.4,0,.2,1)' });
          }
          content.style.setProperty('width', window.innerWidth <= 700 ? (isProjects || isSkills || isMore ? 'calc(100vw - 1.5rem)' : 'calc(100vw - 7rem)') : (isAbout || isProjects || isSkills || isMore ? 'min(64rem, calc(100vw - 10rem))' : 'min(42rem, calc(100vw - 10rem))'), 'important');
          optionGrid.style.setProperty('width', window.innerWidth <= 700 ? '4rem' : '5.5rem', 'important');
          window.setTimeout(function () {
            greetings.forEach(function (greeting) {
              greeting.style.setProperty('transition', 'none', 'important');
            });
            content.style.setProperty('transition', 'none', 'important');
            optionGrid.style.setProperty('transition', 'none', 'important');
          }, isFirstSelection ? 700 : 50);
          document.querySelectorAll('.portfolio-option').forEach(function (option) {
            option.classList.remove('is-selected');
            option.classList.remove('is-opening');
          });
          button.classList.add('is-selected');
          button.classList.add('is-opening');
          title.textContent = sections[label.textContent];
          panel.classList.toggle('is-about', isAbout);
          panel.classList.toggle('is-projects', isProjects);
          panel.classList.toggle('is-skills', isSkills);
          panel.classList.toggle('is-fun', isFun);
          panel.classList.toggle('is-more', isMore);
          content.classList.toggle('is-about', isAbout);
          content.classList.toggle('skills-view', isSkills);
          app.classList.toggle('about-view', isAbout);
          app.classList.toggle('projects-view', isProjects);
          app.classList.toggle('skills-view', isSkills);
          app.classList.toggle('more-view', isMore);
          description.innerHTML = isAbout ? aboutContent : (isProjects ? projectContent : (isSkills ? skillsContent : (isFun ? funContent : (isMore ? moreContent : descriptions[label.textContent]))));
          if (isProjects) requestAnimationFrame(updateProjectArrows);
          panel.classList.remove('is-switching');
          void panel.offsetWidth;
          panel.classList.add('is-switching');
        });
      });
    }());
  </script>

  <script src="script.js"></script>
</body>

</html>
